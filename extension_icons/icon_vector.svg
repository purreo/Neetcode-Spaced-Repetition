<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="nGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.6"/>
  <path d="M 40 85 L 40 45 C 40 35, 52 32, 58 42 L 70 62 C 76 72, 88 69, 88 59 L 88 45"
        fill="none" stroke="url(#nGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M 40 85 L 40 45 C 40 35, 52 32, 58 42 L 70 62 C 76 72, 88 69, 88 59 L 88 45"
        fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Spaced Repetition Nodes -->
  <circle cx="30" cy="30" r="5" fill="#06b6d4" filter="url(#glow)"/><circle cx="30" cy="30" r="2" fill="#fff"/>
  <circle cx="98" cy="30" r="5" fill="#3b82f6" filter="url(#glow)"/><circle cx="98" cy="30" r="2" fill="#fff"/>
  <circle cx="112" cy="64" r="5" fill="#f59e0b" filter="url(#glow)"/><circle cx="112" cy="64" r="2" fill="#fff"/>
  <circle cx="88" cy="105" r="5" fill="#10b981" filter="url(#glow)"/><circle cx="88" cy="105" r="2" fill="#fff"/>
  <circle cx="16" cy="64" r="5" fill="#06b6d4" filter="url(#glow)"/><circle cx="16" cy="64" r="2" fill="#fff"/>
</svg>